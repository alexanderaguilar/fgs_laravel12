title: FAQ
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Question
          -
            handle: answer
            field:
              type: textarea
              display: Answer
          -
            handle: category
            field:
              type: select
              display: Tab category
              required: true
              options:
                generales: Generales
                empresas: Empresas
                territorios: Territorios Progreso
              default: generales
          -
            handle: order
            field:
              type: integer
              display: Order
              default: 0
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
