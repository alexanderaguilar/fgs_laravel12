title: Social Link
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
          -
            handle: url
            field:
              type: text
          -
            handle: icon
            field:
              type: text
          -
            handle: order
            field:
              type: integer
              default: 0
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
